name: "Anycubic S1 MQTT Bridge"
version: "0.0.3"
slug: "anycubic_s1_mqtt_bridge"
description: "Bridge Anycubic S1 -> Home Assistant via MQTT discovery"
url: "https://github.com/ViperRNMC/anycubic-s1-mqtt-bridge"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
host_network: true

options:
  anycubic_ip: ""
  mqtt_broker: "homeassistant.local"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
  snapshot_interval_idle: 300
  snapshot_interval_busy: 30
  info_update_interval: 30
  obico_enabled: false
  obico_api_url: ""
  obico_detection_interval: 30
  obico_threshold: 0.2

schema:
  anycubic_ip: str
  mqtt_broker: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_pass: password?
  snapshot_interval_idle: int
  snapshot_interval_busy: int
  info_update_interval: int
  obico_enabled: bool
  obico_api_url: str
  obico_detection_interval: int(1,)
  obico_threshold: float(0,1)
